<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<title>Live captions</title>
<!--
  SubTalk guest caption viewer. Read-only: it only receives caption events.
  Self-contained (no external files) so the engine (LAN) and the public relay
  (Cloudflare Worker) serve the identical page. Protocol (JSON over WebSocket
  at /ws/viewer):
    hello     {recent:[caption], status:{state}, t, source_t?}
    caption   {seq, event_id, t, speech_end, kind, tr, en}
    status    {state: live|paused|stopped, t}
    clear     {t}            remove everything shown (E-STOP)
    heartbeat {state, t}     engine alive
  The client sends "ping" every 20 s and expects "pong".
-->
<style>
  :root {
    --bg: #0d0f12; --panel: #171a1f; --text: #f4f5f7; --muted: #9aa3ad; --old: #b9c0c8;
    --line: #2a2f37; --accent: #4fb3ff; --live: #3ecf74; --warn: #f2b84b; --bad: #ff6b6b;
    --cap: clamp(26px, 6.2vw, 54px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #fafaf8; --panel: #ffffff; --text: #111316; --muted: #5d6670; --old: #3e454d;
      --line: #dfe2e6; --accent: #0b6fc2; --live: #178a45; --warn: #a86a00; --bad: #c62828;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .langs { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .langs button {
    font: inherit; font-size: 17px; font-weight: 600; padding: 10px 18px; min-height: 44px;
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
  }
  .langs button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); flex: 1; min-width: 150px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--muted); flex: none; }
  .status[data-s="live"] .dot { background: var(--live); box-shadow: 0 0 0 4px color-mix(in srgb, var(--live) 25%, transparent); }
  .status[data-s="paused"] .dot, .status[data-s="reconnecting"] .dot { background: var(--warn); }
  .status[data-s="offline"] .dot { background: var(--bad); }
  .size { display: flex; gap: 6px; }
  .size button {
    font: inherit; font-weight: 700; min-width: 44px; min-height: 44px; border-radius: 10px;
    border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer;
  }
  main {
    flex: 1; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column;
    gap: 0.55em; font-size: var(--cap); line-height: 1.28; overflow-wrap: anywhere;
  }
  main::before { content: ""; flex: 1; }  /* captions sit at the bottom, like subtitles */
  .cap { color: var(--old); font-size: 0.62em; margin: 0; }
  .cap.latest { color: var(--text); font-size: 1em; font-weight: 600; }
  .cap.manual { font-style: italic; }
  .empty { color: var(--muted); font-size: 0.5em; text-align: center; margin: auto 0; }
  footer { padding: 8px 16px 12px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  @media (max-width: 520px) {
    header { padding: 8px 12px; gap: 8px; }
    .langs button { padding: 8px 14px; font-size: 16px; }
    .status { order: 3; flex-basis: 100%; }
  }
</style>
</head>
<body>
<header>
  <div class="langs" role="group" aria-label="Language">
    <button type="button" data-lang="tr" aria-pressed="false">Türkçe</button>
    <button type="button" data-lang="en" aria-pressed="false">English</button>
  </div>
  <div class="status" id="status" data-s="connecting" role="status" aria-live="polite">
    <span class="dot"></span><span id="statusText">…</span>
  </div>
  <div class="size">
    <button type="button" id="smaller" aria-label="Smaller text">A−</button>
    <button type="button" id="bigger" aria-label="Larger text">A+</button>
  </div>
</header>
<main id="captions" aria-live="polite" aria-atomic="false"></main>
<footer id="note"></footer>
<script>
"use strict";
(() => {
  const T = {
    tr: {
      live: "Canlı", paused: "Altyazılar duraklatıldı", stopped: "Altyazılar şu anda yayında değil",
      connecting: "Bağlanıyor…", reconnecting: "Bağlantı koptu, yeniden bağlanıyor…",
      offline: "Altyazı kaynağına şu anda ulaşılamıyor", waiting: "Konuşma bekleniyor…",
      note: "Çeviri yapay zekâ ile otomatik yapılmaktadır; hatalar olabilir.", title: "Canlı altyazı",
    },
    en: {
      live: "Live", paused: "Captions paused", stopped: "Captions are not on air right now",
      connecting: "Connecting…", reconnecting: "Connection lost, reconnecting…",
      offline: "The caption source cannot be reached right now", waiting: "Waiting for speech…",
      note: "Translated automatically by AI; mistakes are possible.", title: "Live captions",
    },
  };
  const MAX_SHOWN = 12, PING_MS = 20000, DEAD_MS = 50000, SOURCE_STALE_MS = 45000;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (_) { /* private mode */ } },
  };
  const $ = (id) => document.getElementById(id);
  const fromUrl = new URLSearchParams(location.search).get("lang");
  let lang = ["tr", "en"].includes(fromUrl) ? fromUrl : (store.get("st.lang") || (navigator.language || "").slice(0, 2));
  if (!["tr", "en"].includes(lang)) lang = "en";
  let scale = Number(store.get("st.scale")) || 1;
  let caps = [];            // [{key, seq, t, kind, tr, en}]
  let srcState = null;      // live | paused | stopped (from the engine)
  let connected = false, everConnected = false;
  let lastMsg = 0, lastSource = 0;
  let ws = null, backoff = 800;

  function applyScale() {
    scale = Math.min(1.8, Math.max(0.6, scale));
    $("captions").style.fontSize = `calc(var(--cap) * ${scale})`;
    store.set("st.scale", String(scale));
  }

  function setLang(l) {
    lang = l;
    store.set("st.lang", l);
    document.documentElement.lang = l;
    document.title = T[l].title;
    document.querySelectorAll(".langs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
    $("note").textContent = T[l].note;
    render();
    renderStatus();
  }

  function render() {
    const box = $("captions");
    const shown = caps.filter((c) => c[lang]).slice(-MAX_SHOWN);
    box.replaceChildren();
    if (!shown.length) {
      const e = document.createElement("p");
      e.className = "empty";
      e.textContent = srcState === "live" ? T[lang].waiting : "";
      box.appendChild(e);
      return;
    }
    shown.forEach((c, i) => {
      const p = document.createElement("p");
      p.className = "cap" + (i === shown.length - 1 ? " latest" : "") + (c.kind === "manual" ? " manual" : "");
      p.textContent = c[lang];
      box.appendChild(p);
    });
    box.scrollTop = box.scrollHeight;
  }

  function viewState() {
    if (!connected) return everConnected ? "reconnecting" : "connecting";
    if (Date.now() - lastSource > SOURCE_STALE_MS) return "offline";
    return srcState || "stopped";
  }

  function renderStatus() {
    const s = viewState();
    $("status").dataset.s = s;
    $("statusText").textContent = T[lang][s];
  }

  function addCaption(m) {
    const key = `${m.t}:${m.seq}`;
    if (caps.some((c) => c.key === key)) return;
    caps.push({ key, seq: m.seq, t: m.t, kind: m.kind, tr: m.tr || "", en: m.en || "" });
    if (caps.length > 60) caps = caps.slice(-60);
  }

  function onMessage(raw) {
    lastMsg = Date.now();
    if (raw === "pong") return;
    let m;
    try { m = JSON.parse(raw); } catch (_) { return; }
    if (!m || typeof m !== "object") return;
    if (m.type === "hello") {
      caps = [];
      (m.recent || []).forEach(addCaption);
      srcState = m.status && m.status.state || null;
      // Relay: how long ago it last heard from the engine. Engine: now.
      const age = typeof m.source_t === "number" && typeof m.t === "number" ? Math.max(0, m.t - m.source_t) : 0;
      lastSource = m.source_t === null ? 0 : Date.now() - age * 1000;
      render();
    } else if (m.type === "caption") {
      lastSource = Date.now();
      if (srcState !== "live" && m.kind !== "manual") srcState = "live";
      addCaption(m);
      render();
    } else if (m.type === "status" || m.type === "heartbeat") {
      lastSource = Date.now();
      if (m.state) srcState = m.state;
      if (m.type === "status") render();
    } else if (m.type === "clear") {
      lastSource = Date.now();
      caps = [];
      render();
    }
    renderStatus();
  }

  function open() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    try {
      ws = new WebSocket(`${proto}://${location.host}/ws/viewer`);
    } catch (_) {
      setTimeout(open, backoff);
      return;
    }
    ws.onopen = () => { connected = true; everConnected = true; backoff = 800; lastMsg = Date.now(); renderStatus(); };
    ws.onmessage = (ev) => onMessage(ev.data);
    ws.onclose = () => {
      connected = false;
      ws = null;
      renderStatus();
      // Jittered backoff so 1,000 phones do not reconnect in the same instant.
      setTimeout(open, backoff * (0.6 + Math.random() * 0.8));
      backoff = Math.min(15000, backoff * 1.8);
    };
    ws.onerror = () => { /* onclose follows */ };
  }

  setInterval(() => {
    if (ws && ws.readyState === 1) {
      if (Date.now() - lastMsg > DEAD_MS) { try { ws.close(); } catch (_) { /* ignore */ } return; }
      try { ws.send("ping"); } catch (_) { /* ignore */ }
    }
  }, PING_MS);
  setInterval(renderStatus, 2000);
  // Phones throttle background tabs: on return, reconnect at once if the socket died.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && ws && ws.readyState === 1 && Date.now() - lastMsg > DEAD_MS) ws.close();
    if (document.visibilityState === "visible") keepAwake();
  });

  let wakeLock = null;
  async function keepAwake() {
    try {
      if ("wakeLock" in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      }
    } catch (_) { /* not allowed / unsupported */ }
  }

  document.querySelectorAll(".langs button").forEach((b) => b.addEventListener("click", () => { setLang(b.dataset.lang); keepAwake(); }));
  $("smaller").addEventListener("click", () => { scale -= 0.1; applyScale(); keepAwake(); });
  $("bigger").addEventListener("click", () => { scale += 0.1; applyScale(); keepAwake(); });
  applyScale();
  setLang(lang);
  open();
})();
</script>
</body>
</html>

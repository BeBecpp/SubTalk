name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip uv
          python -m uv sync --frozen --extra dev
      - name: Glossary validator (pack's own script)
        run: python -I resources/glossary/validate.py
      - name: Tests (no paid API calls)
        run: .venv\Scripts\python.exe -m pytest -q -m "not live"

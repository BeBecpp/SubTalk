  - {gap: 2, dur: 2.0, lang: uncertain, text: "тийм"}
  - {gap: 2, dur: 4.0, lang: mn, text: "Ехова гэрлэлтийг бүтээсэн.", tr: "Evliliği Yehova kurdu."}
  - {gap: 2, dur: 4.0, lang: ja, text: "皆さん、今日は来てくださってありがとうございます。", relation: independent,
     tr: "Herkese bugün geldiğiniz için teşekkür ederim."}
  - {gap: 2, dur: 3.0, lang: mn, text: "Бид гэрлэлтийн тухай Библийн зарчим үзнэ.",

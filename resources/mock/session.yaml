  - {gap: 1.5, dur: 4.0, lang: ja, text: "今日はガルフーさんとあかねさんの結婚式に集まりました。", relation: covered}
  - {gap: 3, dur: 6.0, lang: music, text: ""}
  - {gap: 2, dur: 5.0, lang: mn, text: "Эфэс тавдугаар бүлэг гучин гуравдугаар зүйлийг уншъя.",
     tr: "Efesliler 5:33'ü okuyalım."}
  - {gap: 1.5, dur: 4.0, lang: ja, text: "エフェソス5章33節を読みましょう。", relation: covered}
  - {gap: 2, dur: 5.5, lang: mn, text: "Нөхөр эхнэрээ хайрлаж, эхнэр нөхрөө гүн хүндлэх ёстой.",
     tr: "Koca karısını sevmeli, kadın da kocasına derin saygı göstermelidir."}
  - {gap: 2, dur: 4.5, lang: mn, quality: garbled, text: "ммм ... тэр ... үү", tr: null}
  - {gap: 1.5, dur: 4.5, lang: ja, text: "お互いに忍耐強く、許し合ってください。", relation: resolves_held,

    text: "[Müzik]"
  - label: "[Song]"
    text: "[İlahi]"
  - label: "[Applause]"
    text: "[Alkış]"
  - label: "Prayer (no text)"
    text: "[Dua ediliyor]"
  - label: "Short break"
    text: "Kısa bir ara."
  - label: "Captions paused (technical)"
    text: "Türkçe altyazılara teknik bir nedenle kısa bir ara verildi."

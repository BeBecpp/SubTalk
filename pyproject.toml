[project]
name = "subtalk"
version = "0.1.0"
description = "SubTalk - live Mongolian/Japanese to Turkish captioning for Zoom"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "anthropic>=1.0",
    "numpy>=1.26",
    "websockets>=13.0",
]

[project.optional-dependencies]
# Production AI engine (Computer B, NVIDIA GPU)
asr = ["faster-whisper>=1.1", "onnxruntime>=1.18"]
# Audio sender (Computer A)
sender = ["sounddevice>=0.4.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
subtalk = "subtalk.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subtalk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "sender"]
markers = ["live: makes real paid API calls (needs ANTHROPIC_API_KEY or CLAUDE_KEY)"]
